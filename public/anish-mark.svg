<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" aria-label="Anish monogram logo">
  <rect width="540" height="540" fill="#202020"/>
  <g fill="#fff">
    <!-- The solid right stroke and pointed lower leg of the A. -->
    <path d="M270 118 334 196 300 176 442 405 302 300 345 315 317 265 270 177Z"/>
    <!-- A narrow crossbar, separated from the dark counter above it. -->
    <path d="M220 261h98l2 4H220z"/>
